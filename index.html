<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Identificador de Billetes</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        background-color: #f4f4f4;
      }

      #container {
        margin: 20px auto;
        width: 90%;
        max-width: 400px;
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      video {
        width: 100%;
        border-radius: 10px;
      }

      button {
        padding: 10px 20px;
        margin: 10px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        background-color: #4caf50;
        color: white;
      }

      #label-container {
        margin-top: 20px;
        font-size: 20px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div id="container">
      <h1>Identificador de Billetes</h1>
      <video id="webcam" autoplay playsinline muted></video>
      <div>
        <button type="button" onclick="init()">Iniciar cámara</button>
        <button type="button" onclick="stopCamera()">Detener cámara</button>
      </div>
      <div id="label-container"></div>
    </div>

    <script type="text/javascript">
      const URL = "https://teachablemachine.withgoogle.com/models/axrfm5FxN/";
      let model, webcamStream, labelContainer, maxPredictions;

      async function init() {
        try {
          const modelURL = URL + "model.json";
          const metadataURL = URL + "metadata.json";
          model = await tmImage.load(modelURL, metadataURL);
          maxPredictions = model.getTotalClasses();

          const video = document.getElementById("webcam");
          const constraints = {
            video: {
              facingMode: "environment",
              width: { ideal: 400 },
              height: { ideal: 300 },
            },
          };

          webcamStream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = webcamStream;

          labelContainer = document.getElementById("label-container");
          labelContainer.innerHTML = "Cargando modelo...";

          // Esperar a que se inicie el video antes de empezar la predicción
          video.addEventListener("loadeddata", () => predictLoop(video));
        } catch (err) {
          console.error("Error al iniciar la cámara o cargar el modelo:", err);
          alert(
            "No se pudo acceder a la cámara. Revisa los permisos del navegador."
          );
        }
      }

      async function predictLoop(video) {
        if (!model) return;
        const prediction = await model.predict(video);
        const highest = prediction.reduce((a, b) =>
          a.probability > b.probability ? a : b
        );
        labelContainer.innerHTML =
          "Resultado: " +
          highest.className +
          " (" +
          (highest.probability * 100).toFixed(1) +
          "%)";
        requestAnimationFrame(() => predictLoop(video));
      }

      function stopCamera() {
        if (webcamStream) {
          webcamStream.getTracks().forEach((track) => track.stop());
          webcamStream = null;
          labelContainer.innerHTML = "Cámara detenida.";
        }
      }
    </script>
  </body>
</html>
