<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Identificador de Billetes</title>

  <!-- TensorFlow + Teachable Machine -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f1f1f1;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      color: #333;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      background: #0078d7;
    }
    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
    #webcam-container canvas {
      border-radius: 10px;
      margin-top: 20px;
    }
    #label-container div {
      font-size: 18px;
      margin-top: 10px;
    }
    .status {
      margin-top: 15px;
      font-weight: bold;
    }
    .status.active {
      color: green;
    }
  </style>
</head>

<body>
  <h1>Identificador de Billetes</h1>
  <button id="startBtn" onclick="init()">Iniciar Cámara</button>
  <button id="stopBtn" onclick="stop()" disabled>Detener</button>

  <div id="loadingStatus" style="display:none;">Cargando modelo...</div>
  <div id="webcam-container"></div>
  <div id="label-container"></div>
  <div id="statusIndicator" class="status">Cámara inactiva</div>

  <script type="text/javascript">
    // URL pública del modelo de Teachable Machine
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/MUYTKlVDr/";
    const modelURL = MODEL_URL + "model.json";
    const metadataURL = MODEL_URL + "metadata.json";

    let model, webcam, labelContainer, maxPredictions;
    let isRunning = false;

    async function init() {
      document.getElementById('startBtn').disabled = true;
      document.getElementById('loadingStatus').style.display = 'block';

      try {
        // Cargar modelo
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        // Configurar cámara
        const flip = true;
        const size = 400;
        webcam = new tmImage.Webcam(size, size, flip);
        await webcam.setup({ facingMode: "environment" });
        await webcam.play();

        // Mostrar cámara
        document.getElementById("webcam-container").innerHTML = "";
        document.getElementById("webcam-container").appendChild(webcam.canvas);

        // Contenedor de etiquetas
        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
          labelContainer.appendChild(document.createElement("div"));
        }

        document.getElementById('loadingStatus').style.display = 'none';
        document.getElementById('statusIndicator').textContent = "Cámara activa";
        document.getElementById('statusIndicator').classList.add('active');
        document.getElementById('stopBtn').disabled = false;

        speak("Cámara iniciada. Coloca el billete frente a la cámara.");
        isRunning = true;

        // Pequeño retardo para asegurar que la cámara esté lista antes de predecir
        setTimeout(() => {
          window.requestAnimationFrame(loop);
        }, 1000);

      } catch (error) {
        console.error("Error al inicializar:", error);
        alert("No se pudo acceder a la cámara o cargar el modelo. Revisa los permisos del navegador.");
        speak("Error al iniciar la cámara o el modelo.");
        document.getElementById('startBtn').disabled = false;
        document.getElementById('loadingStatus').style.display = 'none';
      }
    }

    async function loop() {
      webcam.update();
      await predict();
      if (isRunning) window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      for (let i = 0; i < maxPredictions; i++) {
        const classPrediction =
          prediction[i].className + ": " + (prediction[i].probability * 100).toFixed(1) + "%";
        labelContainer.childNodes[i].innerHTML = classPrediction;
      }
    }

    function stop() {
      if (webcam) {
        webcam.stop();
        isRunning = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('statusIndicator').textContent = "Cámara detenida";
        document.getElementById('statusIndicator').classList.remove('active');
        speak("Cámara detenida.");
      }
    }

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "es-ES";
      speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
